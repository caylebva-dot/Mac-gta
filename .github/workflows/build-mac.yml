name: Build Mac app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Mac app (works on Apple Silicon and Intel)
        run: npx electron-builder --mac dmg --universal

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: GTA5-mac
          path: dist/*.dmg
